name: Déploiement GitHub Pages

# main = prod : chaque push sur main (merge d'une epic validée) met le site à jour.
# Le site construit (dist/) est publié dans la branche gh-pages, que GitHub Pages sert
# (Settings → Pages → Source : « Deploy from a branch » → gh-pages / root).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Publier dist/ dans la branche gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'Déploiement ${{ github.sha }}'
